<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Focus — Carnet de mots</title>
<style>
  :root {
    --paper: #EEF0E7;
    --paper-line: rgba(70,100,130,0.14);
    --ink: #1E2A38;
    --ink-soft: #55636D;
    --ink-faint: #93998F;
    --card-bg: #FBFAF4;
    --card-border: #D9D4BE;
    --card-shadow: rgba(30,40,50,0.20);
    --rule-blue: #4E6E8E;
    --accent: #B23A3E;
    --accent-strong: #B23A3E;
    --accent-ink: #FBF7EE;
    --focus: #2662A8;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0, transparent 31px,
        var(--paper-line) 31px, var(--paper-line) 32px
      ),
      var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  a { color: inherit; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: 3rem 2rem 4rem;
    position: relative;
  }
  .page::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: 2.4rem;
    width: 2px;
    background: var(--focus);
    opacity: 0.55;
  }
  @media (max-width: 640px) {
    .page::before { left: 0.9rem; }
    .page { padding: 2.5rem 1.1rem 3rem; }
  }

  .masthead { margin-left: 3rem; margin-bottom: 0.6rem; }
  @media (max-width: 640px) { .masthead { margin-left: 1.5rem; } }
  .eyebrow {
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 0.6rem;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 2.9rem);
    font-weight: 600;
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
    background: linear-gradient(100deg, var(--ink) 40%, var(--focus) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .back-link {
    margin: 1.2rem 0 2.25rem 3rem;
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.88rem;
  }
  @media (max-width: 640px) { .back-link { margin-left: 1.5rem; } }
  .back-link a {
    color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid transparent;
  }
  .back-link a:hover { color: var(--ink); border-bottom-color: var(--ink-faint); }

  .list-view { margin-left: 3rem; max-width: 760px; }
  @media (max-width: 640px) { .list-view { margin-left: 1.5rem; } }
  .list-view p.intro { color: var(--ink-soft); font-style: italic; margin: 0 0 1.75rem; max-width: 60ch; }
  .list-heading {
    display: flex; align-items: center; gap: 0.6rem;
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 1rem; font-weight: 700; color: var(--ink); margin: 0 0 1rem;
  }
  .count-pill {
    font-size: 0.75rem; font-weight: 600; color: var(--focus); background: var(--card-bg);
    border: 1px solid var(--focus); border-radius: 999px; padding: 0.1rem 0.6rem;
    font-variant-numeric: tabular-nums;
  }

  .index-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.6rem; margin-top: 0.9rem;
  }
  .index-tile {
    text-align: left; background: var(--card-bg); cursor: pointer;
    border: 1px solid var(--focus); border-radius: 8px; padding: 0.7rem 0.85rem;
    color: var(--ink-soft); font-size: 0.82rem; display: flex; gap: 0.55rem; align-items: center;
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .index-tile:hover { color: var(--ink); box-shadow: 0 10px 22px -14px var(--card-shadow); }
  .index-tile .idx-emoji { font-size: 1.05rem; flex: none; }
  .index-tile .idx-word { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .index-tile .idx-type {
    flex: none; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint);
  }
  .index-tile .idx-remove {
    flex: none; background: none; border: 1px solid var(--card-border); border-radius: 999px;
    color: var(--ink-faint); cursor: pointer; font-size: 0.7rem; padding: 0.2rem 0.4rem; line-height: 1;
  }
  .index-tile .idx-remove:hover { border-color: var(--accent-strong); color: var(--accent-strong); }

  .no-words {
    color: var(--ink-faint); font-style: italic; font-size: 0.92rem;
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  #focus-browse-all {
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.88rem; margin: 0 0 1.75rem;
  }
  #focus-browse-all a {
    color: var(--focus); text-decoration: none; border-bottom: 1px solid var(--focus);
  }
  #focus-browse-all a:hover { opacity: 0.75; }
  .focus-section { margin-bottom: 2.25rem; }
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <p class="eyebrow">Carnet personnel</p>
    <h1>&#11088; Focus</h1>
  </header>

  <p class="back-link"><a href="carnet-de-mots.html">&larr; Retour au Carnet</a></p>

  <section class="list-view">
    <p class="intro">Les mots que tu as mis en focus &mdash; tri&eacute;s par cat&eacute;gorie. Clique sur un mot pour l&rsquo;ouvrir dans le Carnet (la navigation pr&eacute;c&eacute;dent/suivant reste alors confin&eacute;e &agrave; cette cat&eacute;gorie), ou retire-le directement d&rsquo;ici.</p>
    <p id="focus-browse-all" hidden><a href="#" id="focus-browse-all-link">&#127918; Parcourir tout Focus (<span id="focus-total-count"></span>) dans le Carnet</a></p>
    <div id="focus-sections"></div>
  </section>

</div>

<script src="words-data.js?v=6"></script>
<script>
(function () {
  "use strict";

  var CUSTOM_KEY = "carnet-de-mots-custom";
  var FOCUS_KEY = "carnet-de-mots-focus";
  var GH_TOKEN_KEY = "ghSyncToken";
  var GH_OWNER = "sebmgn";
  var GH_REPO = "ameliorer-vocabulaire";
  var GH_BRANCH = "main";
  var GH_WORDS_PATH = "words.json";
  var GH_PROGRESS_PATH = "progress.json";

  var customEntries = [];
  try {
    customEntries = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]");
  } catch (e) { customEntries = []; }

  var focusSet = {};
  try {
    focusSet = JSON.parse(localStorage.getItem(FOCUS_KEY) || "{}");
  } catch (e) { focusSet = {}; }

  function isFocus(id) { return !!focusSet[id]; }
  function persistFocus() { localStorage.setItem(FOCUS_KEY, JSON.stringify(focusSet)); }

  function getGhToken() {
    try { return localStorage.getItem(GH_TOKEN_KEY) || ""; } catch (e) { return ""; }
  }
  function b64EncodeUtf8(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64DecodeUtf8(str) { return decodeURIComponent(escape(atob(str))); }
  function ghHeaders() {
    var h = { "Accept": "application/vnd.github+json" };
    var t = getGhToken();
    if (t) h["Authorization"] = "Bearer " + t;
    return h;
  }
  function ghProgressUrl() {
    return "https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + GH_PROGRESS_PATH;
  }
  async function ghFetchProgress() {
    var res = await fetch(ghProgressUrl() + "?ref=" + GH_BRANCH, { headers: ghHeaders() });
    if (res.status === 404) return { state: { tags: {}, focus: {} }, sha: null };
    if (!res.ok) throw new Error("GitHub GET " + res.status);
    var data = await res.json();
    var state;
    try { state = JSON.parse(b64DecodeUtf8((data.content || "").replace(/\n/g, ""))); } catch (e) { state = {}; }
    if (!state || typeof state !== "object") state = {};
    if (!state.tags) state.tags = {};
    if (!state.focus) state.focus = {};
    return { state: state, sha: data.sha };
  }
  async function ghPutProgress(state, sha) {
    var body = {
      message: "progress: remove focus",
      content: b64EncodeUtf8(JSON.stringify(state, null, 2)),
      branch: GH_BRANCH
    };
    if (sha) body.sha = sha;
    var res = await fetch(ghProgressUrl(), {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()),
      body: JSON.stringify(body)
    });
    if (res.status === 409 || res.status === 422) { var conflictErr = new Error("conflict"); conflictErr.conflict = true; throw conflictErr; }
    if (!res.ok) throw new Error("GitHub PUT " + res.status);
    var data = await res.json();
    return data.content.sha;
  }
  async function removeFocusRemote(id) {
    if (!getGhToken()) return;
    for (var attempt = 0; attempt < 4; attempt++) {
      try {
        var remote = await ghFetchProgress();
        var nextFocus = Object.assign({}, remote.state.focus);
        delete nextFocus[id];
        await ghPutProgress({ tags: remote.state.tags, focus: nextFocus }, remote.sha);
        return;
      } catch (e) {
        if (e && e.conflict) continue;
        console.error("Focus remote removal failed", e);
        return;
      }
    }
  }
  function removeFocus(id) {
    delete focusSet[id];
    persistFocus();
    removeFocusRemote(id);
  }

  var ENTRIES = [];
  function rebuildEntries() { ENTRIES = BASE_ENTRIES.concat(customEntries); }
  rebuildEntries();

  // Ordre d'affichage des sections, calqué sur l'ordre des filtres du Carnet.
  var CATEGORY_ORDER = [
    "verbe", "adjectif", "nom", "adverbe", "expression", "citation", "humour",
    "blague_courte", "blague_longue", "blague_beauf", "blague_nulle", "contrepeterie", "tu_preferes",
    "anecdote"
  ];

  var sectionsEl = document.getElementById("focus-sections");
  var browseAllEl = document.getElementById("focus-browse-all");
  var browseAllLink = document.getElementById("focus-browse-all-link");
  var totalCountEl = document.getElementById("focus-total-count");

  function goto(entry, subType) {
    var url = "carnet-de-mots.html?focus=" + encodeURIComponent(entry.id);
    if (subType) url += "&sub=" + encodeURIComponent(subType);
    window.location.href = url;
  }

  function buildTile(entry, subType) {
    var tile = document.createElement("div");
    tile.className = "index-tile";
    tile.setAttribute("tabindex", "0");
    tile.setAttribute("role", "button");
    tile.innerHTML =
      '<span class="idx-emoji">' + entry.emoji + '</span>' +
      '<span class="idx-word">' + entry.mot + '</span>' +
      '<span class="idx-type">' + (TYPE_LABELS[entry.type] || "") + '</span>';
    var removeBtn = document.createElement("button");
    removeBtn.className = "idx-remove";
    removeBtn.innerHTML = "&#10005;";
    removeBtn.setAttribute("aria-label", "Retirer du focus");
    removeBtn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      removeFocus(entry.id);
      render();
    });
    tile.appendChild(removeBtn);
    tile.addEventListener("click", function () { goto(entry, subType); });
    tile.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goto(entry, subType); }
    });
    return tile;
  }

  function render() {
    var matching = ENTRIES.filter(function (e) { return isFocus(e.id); });
    totalCountEl.textContent = matching.length;
    browseAllEl.hidden = matching.length === 0;
    sectionsEl.innerHTML = "";
    if (matching.length === 0) {
      sectionsEl.innerHTML = '<p class="no-words">Aucun mot en focus pour l&rsquo;instant &mdash; marque des mots depuis le Carnet avec le bouton &laquo;&nbsp;&#11088; Focus&nbsp;&raquo;.</p>';
      return;
    }
    var byType = {};
    matching.forEach(function (e) {
      if (!byType[e.type]) byType[e.type] = [];
      byType[e.type].push(e);
    });
    var typesPresent = Object.keys(byType).sort(function (a, b) {
      var ia = CATEGORY_ORDER.indexOf(a); if (ia === -1) ia = CATEGORY_ORDER.length;
      var ib = CATEGORY_ORDER.indexOf(b); if (ib === -1) ib = CATEGORY_ORDER.length;
      return ia - ib;
    });
    typesPresent.forEach(function (type) {
      var entries = byType[type];
      var section = document.createElement("div");
      section.className = "focus-section";
      var heading = document.createElement("h2");
      heading.className = "list-heading";
      heading.innerHTML = (TYPE_LABELS[type] || type) + ' <span class="count-pill">' + entries.length + '</span>';
      section.appendChild(heading);
      var grid = document.createElement("div");
      grid.className = "index-grid";
      entries.forEach(function (entry) { grid.appendChild(buildTile(entry, type)); });
      section.appendChild(grid);
      sectionsEl.appendChild(section);
    });
  }

  browseAllLink.addEventListener("click", function (e) {
    e.preventDefault();
    var matching = ENTRIES.filter(function (en) { return isFocus(en.id); });
    if (matching.length) goto(matching[0], null);
  });

  render();

  // Rafraîchit les mots ajoutés depuis les autres appareils (words.json est la
  // référence, le cache local peut être périmé si le Carnet n'a pas resynchro ici).
  fetch("https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + GH_WORDS_PATH + "?ref=" + GH_BRANCH,
    { headers: { "Accept": "application/vnd.github+json" } })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (data) {
      if (!data) return;
      var list = JSON.parse(decodeURIComponent(escape(atob((data.content || "").replace(/\n/g, "")))));
      if (Array.isArray(list)) {
        customEntries = list;
        rebuildEntries();
        render();
      }
    })
    .catch(function () { /* hors-ligne ou repo inaccessible : on garde le cache local */ });

  // Idem pour la liste focus elle-même : un mot mis en focus depuis un autre
  // appareil doit apparaître ici même si ce navigateur-ci n'a jamais resynchro.
  ghFetchProgress()
    .then(function (remote) {
      focusSet = remote.state.focus || {};
      persistFocus();
      render();
    })
    .catch(function () { /* hors-ligne ou repo inaccessible : on garde le cache local */ });
})();
</script>
</body>
</html>
